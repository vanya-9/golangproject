services:

  trackingapp:
    build: 
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/trackingapp/Dockerfile
    container_name: trackingapp
    environment:
      - HTTP_ADDR=:5050
      - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
      - POSTGRES_HOST=trackingapp-postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=${POSTGRES_DATABASE}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
      - LOGGER_LEVEL=${LOGGER_LEVEL}
      - TIME_ZONE=${TIME_ZONE}
      - LOGGER_FOLDER=/app/out/logs
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    ports:
      - "5050:5050"
    restart: always

  trackingapp-postgres:
    image: postgres:18.1-bookworm
    container_name: trackingapp-env-postgres
    environment:
     - POSTGRES_USER=${POSTGRES_USER}
     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
     - POSTGRES_DB=${POSTGRES_DB}
    volumes:
     - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always
  
  trackingapp-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
     - ${PROJECT_ROOT}/migrations:/migrations
    
  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: trackingapp-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:trackingapp-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"
    
